# NODELINK explorer (phase 8): Blockscout indexer + API, web frontend, Postgres.
# Started by scripts/explorer.sh, which sets RPC_URL to a validator's EVM JSON-RPC.
# Image versions are pinned; update them together after checking Blockscout's release notes.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${DB_PASSWORD:-blockscout-local}
      POSTGRES_DB: blockscout
    volumes: [ "db:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U blockscout"], interval: 5s, retries: 20 }

  backend:
    image: blockscout/blockscout:6.8.1
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    extra_hosts: [ "host.docker.internal:host-gateway" ]
    command: sh -c 'bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start'
    environment:
      DATABASE_URL: postgresql://blockscout:${DB_PASSWORD:-blockscout-local}@db:5432/blockscout
      ECTO_USE_SSL: "false"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set by scripts/explorer.sh}
      ETHEREUM_JSONRPC_VARIANT: geth
      ETHEREUM_JSONRPC_HTTP_URL: ${RPC_URL}
      ETHEREUM_JSONRPC_TRACE_URL: ${RPC_URL}
      CHAIN_ID: "778001"
      NETWORK: NODELINK
      SUBNETWORK: ${SUBNETWORK:-Localnet}
      COIN: NODE
      COIN_NAME: NODE
      API_V2_ENABLED: "true"
      DISABLE_EXCHANGE_RATES: "true"
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
      INDEXER_INTERNAL_TRANSACTIONS_TRACER_TYPE: call_tracer
      MICROSERVICE_SC_VERIFIER_ENABLED: "false"
      PORT: "4000"
    ports: [ "4000:4000" ]

  frontend:
    image: ghcr.io/blockscout/frontend:v1.35.2
    restart: unless-stopped
    depends_on: [ backend ]
    environment:
      NEXT_PUBLIC_API_HOST: ${PUBLIC_HOST:-localhost}
      NEXT_PUBLIC_API_PORT: "4000"
      NEXT_PUBLIC_API_PROTOCOL: http
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: ws
      NEXT_PUBLIC_APP_HOST: ${PUBLIC_HOST:-localhost}
      NEXT_PUBLIC_APP_PORT: "3000"
      NEXT_PUBLIC_APP_PROTOCOL: http
      NEXT_PUBLIC_NETWORK_NAME: NODELINK
      NEXT_PUBLIC_NETWORK_SHORT_NAME: NODELINK
      NEXT_PUBLIC_NETWORK_ID: "778001"
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: NODE
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: NODE
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
      NEXT_PUBLIC_NETWORK_RPC_URL: ${PUBLIC_RPC_URL:-http://localhost:8545}
      NEXT_PUBLIC_IS_TESTNET: "true"
      NEXT_PUBLIC_AD_BANNER_PROVIDER: none
      NEXT_PUBLIC_AD_TEXT_PROVIDER: none
    ports: [ "3000:3000" ]

volumes:
  db: